<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File Reader</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<h1>File Reader</h1>

<h3>1. Upload a file or select one</h3>
<ul>
    <li>
        <label for="upload">Upload your own file:</label>
        <input type="file" id="upload-file" accept=".csv,.json" hidden>
        <button id="upload">Browse</button>
    </li>
    <li>
        <label for="file">Select one of the existing files:</label>
        <select id="file"></select>
    </li>
</ul>
<p id="upload-message"></p>

<h3>2. Choose an action</h3>
<ul>
    <li>
        <button class="action" data-action="read">Read</button>
    </li>
    <li>
        <textarea id="data" rows="2" cols="50" placeholder='[{"id": 1, "fruit": "apple", "quantity": 5}, {"id": 2, "fruit": "pear", "quantity": 3}]'></textarea>
        <button class="action" data-action="write">Write</button>
    </li>
    <li>
        <button class="action" data-action="delete">Delete</button>
    </li>
</ul>

<p id="message"></p>
<pre id="result"></pre>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
